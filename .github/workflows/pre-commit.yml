name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.12"
    - run: echo "::add-matcher::.github/workflows/matchers/actionlint.json"
    - uses: pre-commit/action@v3.0.1
    - run: pip install ruff
    - run: ruff check src

  pre-commit-manual:
    strategy:
      fail-fast: false
      matrix:
        hook: [hadolint-docker, helmlint, shellcheck, checkov]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - if: ${{ matrix.hook == 'helmlint' }}
      uses: azure/setup-helm@v5.0.1
      with:
        version: v4.3.1
    - run: echo "::add-matcher::.github/workflows/matchers/actionlint.json"
    - uses: pre-commit/action@v3.0.1
      with:
        extra_args: --all-files -v --hook-stage manual ${{ matrix.hook }}
    - name: Check if values schema is up-to-date
      uses: losisin/helm-values-schema-json-action@v3.2.0
      with:
        working-directory: helm
        fail-on-diff: true
        useHelmDocs: true
